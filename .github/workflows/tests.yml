name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database-rules:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]>=3.1"
      - name: Access rules (who can see and change what)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python tests/db_test.py

  app-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Every app module parses
        run: |
          mkdir -p /tmp/check
          for f in js/*.js; do cp "$f" "/tmp/check/$(basename "$f" .js).mjs"; node --check "/tmp/check/$(basename "$f" .js).mjs" || exit 1; done
          node --check sw.js
